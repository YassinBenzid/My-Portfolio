<div class="mobile-header mobile-haeder1 d-block d-lg-none">
    <div class="container-fluid">
        <div class="col-12">
            <div class="mobile-header-elements">
                <div class="mobile-logo">
                    <a routerLink="/index-1"><img src="assets/img/logo/logo2.png" alt=""></a>
                </div>
                <div class="mobile-nav-icon dots-menu" (click)="toggleMobileMenu()">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="mobile-sidebar mobile-sidebar1 d-block d-lg-none" [class.mobile-menu-active]="isMobileMenuActive">
    <div class="logosicon-area">
        <div class="logos">
            <img src="assets/img/logo/logo2.png" alt="">
        </div>
        <div class="menu-close" (click)="closeMobileMenu()">
            <i class="fa-solid fa-xmark"></i>
        </div>
    </div>
    <div class="lang-switcher mobile-switcher">
        <button type="button" class="lang-btn" [class.active]="lang() === 'en'" (click)="languageService.setLanguage('en')">EN</button>
        <button type="button" class="lang-btn" [class.active]="lang() === 'fr'" (click)="languageService.setLanguage('fr')">FR</button>
    </div>
    <div class="mobile-nav mobile-nav1">
        <ul class="mobile-nav-list nav-list1">
            <li><a class="cursor-pointer" *ngFor="let section of sections"  (click)="scrollToSection(section.id)"
                [class.active]="currentSection === section.id">{{section.name}}</a></li>

        </ul>
        <div class="allmobilesection">
            <div class="btn-area">
                <a href="https://wa.me/21697411310?text=Hi%20Yassine%2C%20I%20came%20from%20your%20portfolio."
                    target="_blank" rel="noopener noreferrer" class="download-btn">{{ t('contact.openWhatsapp') }}</a>
            </div>
            <div class="single-footer">
                <h3>{{ t('contact.eyebrow') }}</h3>
                <div class="footer4-contact-info">
                    <div class="contact-info-single">
                        <div class="contact-info-icon">
                            <i class="fa-solid fa-phone-volume"></i>
                        </div>
                        <div class="contact-info-text">
                            <a href="https://wa.me/21697411310?text=Hi%20Yassine%2C%20I%20came%20from%20your%20portfolio."
                                target="_blank" rel="noopener noreferrer">+216 97 411 310</a>
                        </div>
                    </div>
                    <div class="contact-info-single">
                        <div class="contact-info-icon">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div class="contact-info-text">
                            <a href="mailto:yassinbenzid@gmail.com">yassinbenzid&#64;gmail.com</a>
                        </div>
                    </div>
                    <div class="space20"></div>
                    <div class="single-footer">
                        <h3>{{ t('contact.linkedinLabel') }}</h3>
                        <div class="contact-info-single">
                            <div class="contact-info-icon">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <div class="contact-info-text">
                                <a href="https://www.linkedin.com/in/yassinbenzid/" target="_blank"
                                    rel="noopener noreferrer">linkedin.com/in/yassinbenzid</a>
                            </div>
                        </div>
                    </div>
                    <div class="space20"></div>
                    <div class="single-footer">
                        <h3>{{ t('contact.footerTitle') }}</h3>
                        <div class="social-links-mobile-menu">
                            <ul class="d-flex gap-1 flex-wrap align-items-center">
                                <li><a href="javascript:void(0);"><i class="fa-brands fa-facebook-f"></i></a></li>
                                <li><a href="javascript:void(0);"><i class="fa-brands fa-x-twitter"></i></a></li>
                                <li><a href="javascript:void(0);"><i class="fa-brands fa-instagram"></i></a></li>
                                <li><a href="javascript:void(0);"><i class="fa-brands fa-linkedin-in"></i></a></li>
                                <li><a href="javascript:void(0);"><i class="fa-brands fa-dribbble"></i></a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
