<app-blog-header />

<div class="blog-left-sectionarea">
    <div class="container">
        <div class="row">
            <div class="col-lg-10 m-auto">
                <div class="blog-hedaer-area sp1">
                    <div class="row">
                        <div class="col-lg-8">
                            <div class="heading2">
                                <h4><img src="assets/img/icons/hand1.svg" alt=""> Our Blog</h4>
                                <h2>Our Latest News</h2>
                                <div class="space20"></div>
                                <h2><img src="assets/img/all-images/header-img3.png" alt=""> <span>& Blogs</span></h2>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="blog-btn">
                                <a href="javascript:void(0);">
                                    <span><i class="fa-solid fa-arrow-right"></i> <br> Let’s Talk</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="blog-left-area sp1">
                    <div class="row">
                        <div class="col-lg-7">
                            <div class="blog-details-area2">
                                <div class="row">
                                    <div *ngFor="let blog of blogs" class="col-lg-6 col-md-6">
                                        <app-blog-right-card [blog]="blog" />
                                    </div>

                                    <div class="space50"></div>
                                    <div class="col-lg-12">
                                        <div class="pagination-area">
                                            <app-pagination />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-5">
                            <app-blog-filter containerClass="blog-right-area padding-right" />
                        </div>
                    </div>
                </div>

                <app-contact class="contact-section-area2" />
            </div>
        </div>
    </div>
</div>
