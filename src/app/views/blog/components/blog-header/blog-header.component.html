<app-mobile-menu />
<header class="header about-bg d-none d-lg-block  homepage1-body">
    <div class="header-area header  homepage1-body header-sticky"   [ngClass]="{ 'sticky': isSticky }" id="header">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="header-elements">
                        <div class="site-logo">
                            <a routerLink="/index"><img src="assets/img/logo/logo2.png" alt=""></a>
                        </div>
                        <div class="main-menu">
                            <ul>
                                <li><a routerLink="/index-1" class=" mainhome">Home</a></li>
                                <li><a routerLink="/index-1">About Us</a></li>
                                <li><a routerLink="/index-1"> Service</a></li>
                                <li><a routerLink="/index-1"> Project</a></li>
                                <li><a href="javascript:void(0);">Blogs <span><i
                                                class="fa-solid fa-angle-down"></i></span></a>
                                    <ul class="dropdown-padding">
                                        <li><a routerLink="/blog-left">Blog Left Side</a></li>
                                        <li><a routerLink="/blog-right">Blog RIght Side</a></li>
                                        <li><a routerLink="/blog-details">Blog Single </a></li>
                                    </ul>
                                </li>
                            </ul>
                        </div>

                        <div class="contact-3 d-lg-block d-none">
                            <div class="consulting2">
                                <div class="btn-area">
                                    <a href="javascript:void(0);" class="download-btn">Hire Me</a>
                                </div>
                                <a class="header__bar hamburger_menu header__bar-icon" href="javascript:void(0);"
                                    (click)="toggleSidebar()">
                                    <i class="fa-duotone fa-solid fa-bars-staggered"></i>
                                </a>
                            </div>
                        </div>

                        <div class="slide-bar slide-bar1" [ngClass]="{ 'show': isActive }">
                            <div class="sidebar-info">
                                <div class="sidebar-logo">
                                    <a routerLink="/index">
                                        <img src="assets/img/logo/logo2.png" alt="logo">
                                    </a>
                                    <div class="close-mobile-menu" (click)="toggleSidebar()">
                                        <a><i class="fa-solid fa-xmark"></i></a>
                                    </div>
                                </div>
                                <div class="sidebar-content">
                                    <ul>
                                        <li><a routerLink="/index-1">Home</a></li>
                                        <li><a routerLink="/index-1">About Us</a></li>
                                        <li><a routerLink="/index-1">service</a></li>
                                        <li><a routerLink="/index-1">Project</a></li>
                                        <li><a routerLink="/index-1">Blogs</a></li>
                                        <li><a routerLink="/index-1">Contact</a></li>
                                    </ul>
                                </div>
                                <div class="space32"></div>
                                <div class="btn-area">
                                    <a routerLink="/contact" class="download-btn">Get in touch now</a>
                                </div>
                                <div class="space40"></div>
                                <div class="social-link-area">
                                    <h3 class="sidebar-heading">Social Links</h3>
                                    <ul>
                                        <li>
                                            <a href="javascript:void(0);"><i class="fa-brands fa-facebook-f"></i></a>
                                            <a href="javascript:void(0);"><i class="fa-brands fa-instagram"></i></a>
                                            <a href="javascript:void(0);"><i class="fa-brands fa-x-twitter"></i></a>
                                            <a href="javascript:void(0);"><i class="fa-brands fa-linkedin-in"></i></a>
                                            <a href="javascript:void(0);"><i class="fa-brands fa-pinterest-p"></i></a>
                                        </li>
                                    </ul>
                                </div>
                                <div class="form-area">
                                    <h3>Subscribe To Newsletter</h3>
                                    <form>
                                        <input type="text" placeholder="Email Address*">
                                        <button type="submit" class="download-btn">subscribe</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="body-overlay" [ngClass]="{ 'active': isActive }"></div>
    </div>
</header>
