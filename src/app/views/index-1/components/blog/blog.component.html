<div id="blog">
    <div class="blog-section-area">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="blog-header-area">
                        <div class="pbmit-heading-subheading animation-style2">
                            <h4> <img src="assets/img/icons/star.svg" alt="">{{ t('blog.eyebrow') }}</h4>
                            <h2 class="pbmit-title">{{ t('blog.title') }}</h2>
                            <span class="designer pbmit-title">{{ t('blog.accent') }}</span>
                            <span class="marketer">{{ t('blog.subtitle') }}
                                <app-text-decoration />
                            </span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6 col-md-6" *ngFor="let blog of blogs; let i = index" x>
                            <div class="blog-box-area click-here" [ngClass]="'box' + (i + 1)">
                                <div class="images" data-aos="zoom-in" data-aos-duration="1000">
                                    <img [src]="blog.image" alt="">
                                </div>
                                <div class="content-area" data-aos="flip-right" data-aos-duration="1000">
                                    <div class="tags-area">
                                        <a href="javascript:void(0);"><img src="assets/img/icons/calender.svg" alt="">{{
                                            blog.date }}</a>
                                        <a href="javascript:void(0);"><img src="assets/img/icons/user.svg" alt="">{{
                                            blog.author }}</a>
                                    </div>
                                    <div class="header-site-icon">
                                        <a routerLink="/blog-details">{{ blog.title }}</a>
                                    </div>
                                    <p>{{ blog.description }}</p>
                                    <div class="space20"></div>
                                    <a routerLink="/blog-details" class="readmore">
                                        <span>read More</span><i class="fa-solid fa-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-12">
                            <div class="btn-area text-center">
                                <a href="javascript:void(0);" class="download-btn">{{ t('blog.button') }}</a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
