<div id="portfolio">
    <div class="portfolio-section-area">
        <div class="container">
            <div class="row">
                <div class="col-lg-10">
                    <div class="portfolio-header-area">
                        <div class="pbmit-heading-subheading animation-style2">
                            <h4> <img src="assets/img/icons/star.svg" alt="">{{ t('portfolio.eyebrow') }}</h4>
                            <h2 class="pbmit-title">{{ t('portfolio.titlePrefix') }} <span class="designer">{{ t('portfolio.titleAccent') }}</span></h2>
                            <span class="marketer">{{ t('portfolio.subtitle') }}
                                <app-text-decoration />
                            </span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-6 col-md-6" *ngFor="let item of portfolioList">
                            <app-portfolio-card [portfolioItem]="item" />
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
