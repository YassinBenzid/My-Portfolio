<div class="sidebar-main">
    <div class="sidebar-area">
        <div class="logo">
            <a href="javascript:void(0);"><img src="assets/img/logo/logo2.png" alt=""></a>
        </div>
        <div class="lang-switcher">
            <button type="button" class="lang-btn" [class.active]="lang() === 'en'" (click)="languageService.setLanguage('en')">EN</button>
            <button type="button" class="lang-btn" [class.active]="lang() === 'fr'" (click)="languageService.setLanguage('fr')">FR</button>
        </div>
        <div id="list-example" class="list-group">
            <a class="list-group-item list-group-item-action cursor-pointer {{isLast ? 'm-0' : ''}}" *ngFor="let section of sections;let i = index; let isLast = last"  (click)="scrollToSection(section.id)"
                [class.active]="currentSection === section.id">
                <img [src]="section.icon" alt="">
                {{ section.name }}
            </a>
        </div>
    </div>
</div>
