<div id="feedback">
    <div class="testimonial-section-area">
        <div class="container">
            <div class="row">
                <div class="col-lg-10">
                    <div class="testimonial-header-area">
                        <div class="pbmit-heading-subheading animation-style2">
                            <h4> <img src="assets/img/icons/star.svg" alt="">{{ t('testimonials.eyebrow') }}</h4>
                            <h2 class="pbmit-title">{{ t('testimonials.title') }}</h2>
                            <span class="designer pbmit-title">{{ t('testimonials.accent') }}</span>
                            <span class="marketer">{{ t('testimonials.subtitle') }}
                                <app-text-decoration />
                            </span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-12">
                    <div class="testimonial-box-area">
                        <div class="testimonial-content">
                            <img src="assets/img/all-images/testimonial-img1.png" alt="" class="testimonial1"
                                data-aos="fade-left" data-aos-duration="800">
                            <img src="assets/img/all-images/testimonial-img2.png" alt="" class="testimonial2"
                                data-aos="fade-right" data-aos-duration="900">
                            <img src="assets/img/all-images/testimonial-img3.png" alt="" class="testimonial3"
                                data-aos="fade-left" data-aos-duration="1000">
                            <img src="assets/img/all-images/testimonial-img4.png" alt="" class="testimonial4"
                                data-aos="fade-right" data-aos-duration="1200">

                            <owl-carousel-o [options]="carouselOptions">
                                <ng-template carouselSlide *ngFor="let testimonial of testimonials">
                                    <div class="content">
                                        <ul>
                                            <li *ngFor="let star of [1,2,3,4]"><i class="fa-solid fa-star"></i></li>
                                            <li><i class="fa-duotone fa-star"></i></li>
                                        </ul>
                                        <p>{{ testimonial.text }}</p>
                                        <a href="javascript:void(0);" class="name">{{ testimonial.author }}</a>
                                        <a href="javascript:void(0);" class="readmore">{{ t('testimonials.more') }}</a>
                                    </div>
                                </ng-template>
                            </owl-carousel-o>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
