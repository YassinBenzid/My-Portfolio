<div id="service">
    <div class="service1-section-area">
        <div class="container">
            <div class="row">
                <div class="col-lg-10">
                    <div class="service-header-area">
                        <div class="pbmit-heading-subheading animation-style2">
                            <h4> <img src="assets/img/icons/star3.png" alt="">What I Do</h4>
                            <h2 class="pbmit-title">Software Engineering</h2>
                            <span class="designer pbmit-title">Full-Stack</span>
                            <span class="marketer">Services
                                <app-text-decoration-2 />
                            </span>
                        </div>
                    </div>

                    <div class="service-boxs-area">
                        <img src="assets/img/icons/star4.png" alt="" class="star2 keyframe5">
                        <div class="service-author-box" *ngFor="let service of services" [ngClass]="service.boxClass"
                            [attr.data-aos]="'zoom-out'" [attr.data-aos-duration]="service.aosDuration" [ngStyle]="{
                              'background-image': service.boxClass === 'box1' ? 'url(assets/img/bg/polygon9.png)' : 'url(assets/img/bg/polygon8.png)',
                              'background-position': 'center',
                              'background-repeat': 'no-repeat',
                            }">
                            <img *ngIf="service.polygon" src="assets/img/bg/polygon9.png" alt="" class="polygon2" />
                            <div class="content">
                                <div class="icons">
                                    <img [src]="service.icon" alt="" />
                                </div>
                                <p>{{ service.title }}</p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
